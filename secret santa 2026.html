<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030605">
<title>SECRET SANTA 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030605;--g0:#06190f;--g1:#0a2a1f;--g2:#0f3a2b;--g3:#17523e;
  --gold:#cfa84a;--gold-l:#f2dc9b;--gold-d:#8b6a21;--ivory:#f4eedf;--mute:#b8b19d;
  --line:rgba(207,168,74,.38);
  --metal:linear-gradient(180deg,#f7e7b4 0%,#d9b55a 38%,#a67c2a 62%,#e8cd7e 100%);
  --serif:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Zen Kaku Gothic New','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --latin:'Cinzel','Times New Roman',serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ivory)}
body{font-family:var(--sans);font-size:16px;line-height:1.7;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(120% 55% at 50% -8%,rgba(23,82,62,.6) 0%,rgba(6,25,15,.55) 45%,transparent 75%),
  radial-gradient(90% 35% at 50% 108%,rgba(207,168,74,.10) 0%,transparent 70%),var(--bg);background-attachment:fixed}
button{font-family:inherit;cursor:pointer}
a{color:var(--gold-l)}
#fx,#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:0}#confetti{z-index:88}
.beams{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.beams i{position:absolute;top:-8%;width:62vw;max-width:460px;height:115vh;background:linear-gradient(180deg,rgba(255,240,205,.09),rgba(255,240,205,0) 78%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);filter:blur(8px);transform-origin:50% 0}
.beams i:nth-child(1){left:-14vw;animation:bl 11s ease-in-out infinite alternate}
.beams i:nth-child(2){right:-14vw;animation:br 11s ease-in-out infinite alternate}
@keyframes bl{from{transform:rotate(-26deg)}to{transform:rotate(-10deg)}}
@keyframes br{from{transform:rotate(26deg)}to{transform:rotate(10deg)}}
#app{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:calc(10px + var(--st)) 18px calc(48px + var(--sb))}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:48px;margin-bottom:6px;gap:10px}
.tb-btn{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.4);color:var(--ivory);font:500 14px var(--sans);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.tb-btn .ic{width:18px;height:18px}
.menu-top{display:flex;justify-content:flex-end;min-height:48px}
.testbar{position:relative;z-index:3;border:1px dashed var(--gold);background:rgba(207,168,74,.10);border-radius:14px;padding:12px 14px;margin:0 0 12px;font-size:14px;line-height:1.6}
.testbar b{color:var(--gold-l)}
.testbar select{font:500 16px var(--sans);margin-top:6px;padding:8px;border-radius:10px;background:#0b241b;color:var(--ivory);border:1px solid var(--line);width:100%}
.testbar .row{display:flex;gap:8px;margin-top:8px}
.mini{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ivory);font:500 14px var(--sans)}
.warnbar{border-color:#a8433c;background:rgba(120,30,30,.3)}

/* headings */
.ph{text-align:center;margin:8px 0 22px}
.ph .en{font:600 12px var(--latin);letter-spacing:.34em;padding-left:.34em;color:var(--gold)}
.ph h2{font:800 26px/1.4 var(--serif);margin:6px 0 0}
.ph .sub{color:var(--mute);font-size:14px;margin:8px 0 0}
.ph .rule{width:56px;height:1px;background:var(--metal);margin:14px auto 0}

/* card */
.card{position:relative;background:linear-gradient(180deg,rgba(15,58,43,.58),rgba(6,25,15,.82));border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin:0 0 16px;box-shadow:inset 0 1px 0 rgba(242,220,155,.12),0 12px 30px rgba(0,0,0,.35)}
.card h3{font:700 18px/1.45 var(--serif);margin:0 0 10px;color:var(--gold-l)}
.card p{margin:0 0 10px}.card p:last-child{margin-bottom:0}
.center{text-align:center}.fine{font-size:13px;color:var(--mute);line-height:1.6}.lead{text-align:center;font:700 17px var(--serif);margin:6px 0 14px}
.notice{border-radius:14px;padding:14px 16px;margin-bottom:16px;font-weight:700;text-align:center;border:1px solid var(--gold);background:rgba(207,168,74,.12);color:var(--gold-l)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:12px 18px;border-radius:14px;border:1px solid transparent;font:700 17px/1.35 var(--sans);text-decoration:none;margin:0 0 12px;text-align:center;color:var(--ivory)}
.btn .ic{width:22px;height:22px;flex:none}
.btn-gold{background:var(--metal);color:#1d1606;box-shadow:0 6px 18px rgba(207,168,74,.22),inset 0 1px 0 rgba(255,255,255,.55)}
.btn-line{background:rgba(0,0,0,.35);border-color:var(--gold);color:var(--gold-l)}
.btn-ghost{background:rgba(0,0,0,.2);border-color:rgba(244,238,223,.24);color:var(--ivory)}
.btn-danger{background:rgba(110,20,20,.35);border-color:#a8433c;color:#ffd9d2}
.btn:disabled{opacity:.38}
.btn:active,.nbtn:active,.mcard:active,.ch:active{transform:scale(.985)}

/* hero */
.hero{text-align:center;padding:0 0 22px}
.tree{width:132px;height:auto;display:block;margin:0 auto -2px;filter:drop-shadow(0 0 26px rgba(207,168,74,.28))}
.orn{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.45}50%{opacity:1}}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.eyebrow{font:600 11px var(--latin);letter-spacing:.42em;padding-left:.42em;color:var(--gold);margin-top:8px}
.logo{font:800 clamp(48px,15.5vw,74px)/.98 var(--latin);letter-spacing:.04em;margin:8px 0 0;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(207,168,74,.35))}
.logo span{display:block}
.logo-year{display:flex;align-items:center;justify-content:center;gap:14px;font:600 22px var(--latin);letter-spacing:.35em;padding-left:.35em;color:var(--gold-l);margin-top:8px}
.logo-year i{width:42px;height:1px;background:var(--metal)}
.hero-sub{color:var(--mute);font-size:14px;margin:14px 0 16px}
.countbox{display:inline-flex;align-items:baseline;gap:10px;padding:10px 24px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.4);font-size:14px}
.countbox b{font:800 30px var(--latin);background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}

/* menu */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{position:relative;display:flex;flex-direction:column;gap:6px;min-height:156px;padding:16px 14px 14px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(15,58,43,.62),rgba(4,14,9,.9));text-decoration:none;color:var(--ivory);box-shadow:inset 0 1px 0 rgba(242,220,155,.14),0 10px 24px rgba(0,0,0,.35);overflow:hidden}
.mcard::after{content:'';position:absolute;inset:0;border-radius:18px;background:linear-gradient(120deg,transparent 30%,rgba(255,240,200,.07) 45%,transparent 60%);pointer-events:none}
.mcard.wide{grid-column:1/-1;min-height:120px;flex-direction:row;align-items:center;gap:14px}
.mcard.wide .tx{display:flex;flex-direction:column;gap:2px}
.mcard .no{font:600 12px var(--latin);color:var(--gold);letter-spacing:.2em}
.mcard .ic{width:30px;height:30px;color:var(--gold-l);flex:none}
.mcard.wide .ic{width:40px;height:40px}
.mcard .t{font:700 16px/1.4 var(--serif)}
.mcard .en2{font:600 10px var(--latin);letter-spacing:.2em;color:var(--mute)}
.mcard .s{font-size:12px;color:var(--gold-l);margin-top:auto;line-height:1.5}
.mcard.wide .s{margin-top:2px}
.mcard.locked .s{color:var(--mute)}
.menu-foot{margin-top:26px}
.menu-foot .btn{min-height:52px;font-size:15px}

/* warning */
.warn{border:1.5px solid var(--gold);background:linear-gradient(180deg,rgba(207,168,74,.14),rgba(207,168,74,.04));border-radius:16px;padding:18px 16px;margin-bottom:18px}
.warn .big{font:800 21px/1.45 var(--serif);color:var(--gold-l);margin-bottom:8px}
.warn ul{margin:0;padding-left:1.2em}.warn li{font-weight:700;font-size:16px;margin:4px 0}

/* names */
.names{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.nbtn{min-height:104px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.38);color:var(--ivory);font:800 23px/1.3 var(--serif);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.nbtn small{font:500 12px/1.4 var(--sans);color:var(--mute)}
.nbtn.done{border-color:var(--gold)}.nbtn.done small{color:var(--gold-l)}
.whoname{font:800 46px/1.2 var(--serif);margin:6px 0 10px;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.whoname span{font-size:.45em}

/* pin */
.pinwrap{text-align:center;padding:6px 0 10px}
.pin-title{font:800 21px/1.45 var(--serif);color:var(--gold-l)}
.pin-note{font-size:14px;color:var(--mute);margin:8px 0 0;line-height:1.7}
.pin-err{color:#ffb4a8;font-weight:700;margin:10px 0 0}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:22px 0}
.pin-dots i{width:52px;height:60px;border-radius:12px;border:1.5px solid var(--line);background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font:800 30px/1 var(--sans);font-style:normal;color:var(--gold-l)}
.pin-dots i.on{border-color:var(--gold);box-shadow:0 0 12px rgba(207,168,74,.3)}
.pin-dots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:310px;margin:0 auto}
.pad button{height:66px;border-radius:18px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--ivory);font:600 26px var(--latin)}
.pad button.fn{font:500 15px var(--sans);color:var(--mute)}

/* choice */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ch{min-height:52px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ivory);font:700 15px/1.3 var(--sans);padding:6px}
.ch.on{background:var(--metal);color:#1d1606;border-color:transparent}
.ch:disabled{opacity:.45}
.qblock{padding:14px 0;border-bottom:1px solid rgba(207,168,74,.18)}
.qblock:last-child{border-bottom:0}
.qblock .qh{font-weight:700;margin-bottom:10px;line-height:1.5}
.qblock .qh .qn{color:var(--gold);font:700 15px var(--latin);margin-right:6px}
.qblock .lockmsg{font-size:12px;color:var(--mute);margin-top:6px}
.inp{width:100%;min-height:54px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.45);color:var(--ivory);font:500 17px var(--sans);padding:12px 14px;resize:vertical}
.inp:focus{outline:2px solid var(--gold);outline-offset:1px}
label.lb{display:block;font-weight:700;margin:0 0 8px}

/* hints */
.qlist{margin:0;padding:0;list-style:none}
.qlist li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(207,168,74,.15);font-weight:500}
.qlist li:last-child{border-bottom:0}
.qn{font:700 14px var(--latin);color:var(--gold);flex:none;min-width:28px}
.phs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.phc{border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;background:rgba(0,0,0,.32)}
.phc .l{font:700 15px var(--serif);color:var(--gold-l)}
.phc .d{font-size:12px}.phc .s{font-size:11px;color:var(--mute);line-height:1.5}
.phc.open{border-color:var(--gold);background:rgba(207,168,74,.12)}
.phc.ready{border-color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(207,168,74,0)}50%{box-shadow:0 0 18px rgba(207,168,74,.45)}}
.hrow{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(207,168,74,.14)}
.hrow:last-child{border-bottom:0}
.hrow .qt{font-size:14px;line-height:1.5}
.hrow .ans{text-align:right}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mute);white-space:nowrap}
.lock .ic{width:14px;height:14px}
.a{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;line-height:1.35;text-align:center;max-width:7.2em}
.a0{background:rgba(31,107,80,.55);border:1px solid #3f9c79}
.a1{background:rgba(120,30,30,.45);border:1px solid #a8433c}
.a2{background:rgba(207,168,74,.16);border:1px solid var(--gold);color:var(--gold-l)}
.a-none{font-size:12px;color:var(--mute)}
.hrow.rv .ans>*{animation:ansIn .7s both;animation-delay:inherit}
.hrow.rv{animation:rowGlow 1.2s both}
@keyframes ansIn{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:none}}
@keyframes rowGlow{0%{background:transparent}40%{background:rgba(207,168,74,.16)}100%{background:transparent}}

/* schedule */
.tl{position:relative;padding-left:30px;margin-top:4px}
.tl::before{content:'';position:absolute;left:9px;top:10px;bottom:10px;width:1px;background:var(--metal)}
.tli{position:relative;margin-bottom:14px}
.tli::before{content:'';position:absolute;left:-26px;top:26px;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--gold);background:var(--bg)}
.tli.done::before{background:var(--gold);box-shadow:0 0 12px rgba(207,168,74,.6)}
.tli .card{margin:0}
.dt{font:800 30px/1.1 var(--latin);background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--gold-l);margin-left:6px;vertical-align:middle}
.tag.on{background:var(--gold);color:#1d1606;border-color:transparent}
.live{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:10px}
.live div{border:1px solid var(--line);border-radius:12px;padding:8px 0;background:rgba(0,0,0,.35)}
.live b{display:block;font:800 28px/1.2 var(--latin);color:var(--gold-l)}
.live span{font-size:11px;color:var(--mute)}

/* overlay */
#ov{position:fixed;inset:0;z-index:75;background:#000;display:none;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:calc(24px + var(--st)) 20px calc(24px + var(--sb));overflow-x:hidden;overflow-y:auto}
#ov.on{display:flex}
.ovc{position:relative;z-index:3;width:100%;max-width:440px;margin:auto 0}
.spot{position:absolute;top:-6%;width:72vw;max-width:520px;height:112%;background:linear-gradient(180deg,rgba(255,246,220,.5),rgba(255,246,220,.06) 70%,transparent);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);filter:blur(10px);opacity:0;transition:opacity 1s ease;transform-origin:50% 0;pointer-events:none;z-index:1}
.spot.l{left:-22vw;transform:rotate(-24deg)}.spot.r{right:-22vw;transform:rotate(24deg)}
.spot.c{left:50%;transform:translateX(-50%);opacity:0}
.lit .spot{opacity:.7}.lit .spot.c{opacity:.45;transition-delay:.6s}
.lit .spot.l{animation:swL 6s ease-in-out infinite alternate}.lit .spot.r{animation:swR 6s ease-in-out infinite alternate}
@keyframes swL{from{transform:rotate(-32deg)}to{transform:rotate(-12deg)}}
@keyframes swR{from{transform:rotate(32deg)}to{transform:rotate(12deg)}}
.floor{position:absolute;left:50%;bottom:-8vh;width:150vw;height:36vh;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 30%,rgba(207,168,74,.3),rgba(23,82,62,.2) 40%,transparent 70%);opacity:0;transition:opacity 1.2s .3s;pointer-events:none;z-index:1}
.lit .floor{opacity:1}
.ov-x{position:absolute;top:calc(12px + var(--st));right:14px;z-index:5}
#intro{position:fixed;inset:0;z-index:85;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .7s}
#intro.out{opacity:0;pointer-events:none}
.ttl{position:relative;z-index:3;opacity:0}
.ttl.show{animation:titleIn 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes titleIn{0%{opacity:0;transform:scale(.65);filter:blur(12px)}55%{opacity:1;filter:blur(0)}75%{transform:scale(1.04)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
.skip{position:absolute;bottom:calc(28px + var(--sb));left:0;right:0;z-index:3;font-size:13px;color:var(--mute)}
.op-names{position:relative;z-index:3;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.op-names span{padding:6px 14px;border:1px solid var(--line);border-radius:999px;font:700 16px var(--serif);opacity:.25;transition:all .4s}
.op-names span.met{opacity:.85}
.op-names span.on{opacity:1;background:var(--metal);color:#1d1606;transform:scale(1.14);box-shadow:0 0 26px rgba(207,168,74,.6)}
.op-sub{position:relative;z-index:3;min-height:4.8em;display:flex;align-items:center;justify-content:center;font:800 clamp(20px,6vw,27px)/1.5 var(--serif);text-shadow:0 2px 14px rgba(0,0,0,.9);margin-top:22px;padding:0 6px}
.op-sub.in{animation:subIn .45s ease both}
@keyframes subIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.op-end{position:relative;z-index:3;width:100%;max-width:360px;margin-top:20px}
.cc{font-size:12px;color:var(--mute);letter-spacing:.2em;font-family:var(--latin)}

/* roulette */
.rl-who{font:700 18px/1.5 var(--serif);margin-bottom:18px}
.slot{position:relative;height:132px;border:1px solid var(--gold);border-radius:20px;display:flex;align-items:center;justify-content:center;gap:6px;font:800 46px var(--serif);background:radial-gradient(ellipse at 50% 50%,rgba(23,82,62,.5),rgba(0,0,0,.9));box-shadow:inset 0 0 40px rgba(207,168,74,.18),0 0 30px rgba(207,168,74,.15);margin-bottom:18px;overflow:hidden}
.slot::before,.slot::after{content:'';position:absolute;left:0;right:0;height:30px;pointer-events:none}
.slot::before{top:0;background:linear-gradient(#000,transparent)}.slot::after{bottom:0;background:linear-gradient(transparent,#000)}
.slot em{font-style:normal;font-size:.45em;align-self:flex-end;margin-bottom:34px}
.slot.final{border-width:2px;animation:pop .7s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 50px rgba(207,168,74,.55),inset 0 0 40px rgba(207,168,74,.3)}
.slot.final span{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes pop{0%{transform:scale(.9)}100%{transform:scale(1)}}
.rl-msg{min-height:3.4em;font:700 17px/1.6 var(--sans);margin-bottom:14px}
.rl-msg b{color:var(--gold-l);font-size:20px}
.secret{font-size:14px;color:var(--mute);margin-bottom:14px}
.hide-in .ic{width:64px;height:64px;color:var(--gold)}
.hide-in h2{font:800 26px var(--serif);margin:12px 0 6px}
.hide-in p{color:var(--mute);margin:0 0 26px}

/* lock ceremony */
.biglock{width:120px;height:120px;color:var(--gold-l);margin:0 auto 10px;display:block;filter:drop-shadow(0 0 20px rgba(207,168,74,.5))}
.biglock .shackle{transform-box:fill-box;transform-origin:100% 100%;transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.biglock.open .shackle{transform:translateY(-3px) rotate(32deg)}
.biglock.shake{animation:shake .5s 2}

/* final */
.fin-t{font:800 24px/1.5 var(--serif);color:var(--gold-l);margin-bottom:10px}
.cd{font:800 170px/1 var(--latin);background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;animation:cdp .9s ease both;filter:drop-shadow(0 0 30px rgba(207,168,74,.5))}
@keyframes cdp{0%{opacity:0;transform:scale(2.2)}30%{opacity:1;transform:scale(1)}100%{opacity:.15;transform:scale(.8)}}
.pairs{display:grid;gap:12px;width:100%}
.pair{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:6px;padding:16px 12px;border:1px solid var(--gold);border-radius:16px;background:linear-gradient(180deg,rgba(15,58,43,.75),rgba(4,14,9,.9))}
.pairs.anim .pair{animation:flipIn .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes flipIn{0%{opacity:0;transform:perspective(600px) rotateX(90deg)}100%{opacity:1;transform:none}}
.pair .nm{font:800 22px/1.3 var(--serif)}
.pair .ar{color:var(--gold);font:800 22px var(--latin)}
.pair .gift{grid-column:1/-1;font-size:13px;color:var(--mute);border-top:1px solid rgba(207,168,74,.2);padding-top:8px;margin-top:4px;line-height:1.5}
.pair .gift b{color:var(--gold-l)}
.small-lbl{font-size:11px;color:var(--mute);display:block}
.judge .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cmp{background:rgba(0,0,0,.3);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px;line-height:1.6}
.cmp .k{font-size:12px;color:var(--mute);display:block}
.oklist{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.oklist li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(207,168,74,.12)}
.oklist .ok{color:#8fe0b9;font-weight:700}.oklist .ng{color:var(--mute)}
.rank-row{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:rgba(15,58,43,.6);text-align:left}
.rank-row.hid{opacity:0;transform:translateY(18px)}
.rank-row.show{opacity:1;transform:none;transition:all .7s cubic-bezier(.2,.8,.2,1)}
.rank-row.first{border-color:var(--gold);box-shadow:0 0 30px rgba(207,168,74,.35);background:linear-gradient(180deg,rgba(207,168,74,.22),rgba(15,58,43,.6))}
.rk{font:800 21px var(--latin);color:var(--gold-l);line-height:1.1}.rk small{display:block;font:500 11px var(--sans);color:var(--mute)}
.rn{font:800 20px var(--serif)}.rn small{display:block;font:500 12px var(--sans);color:var(--mute)}
.rp{font:800 26px var(--latin);color:var(--gold-l)}.rp small{font:500 12px var(--sans);margin-left:2px}

/* certificate */
.cert{background:#f5eedb;color:#2a2210;border-radius:4px;padding:10px;box-shadow:0 24px 60px rgba(0,0,0,.6);margin:0 auto 22px;max-width:440px;width:100%}
.cert-in{border:2px solid #b08a2e;outline:1px solid #b08a2e;outline-offset:-9px;padding:30px 18px 24px;text-align:center;background:radial-gradient(circle at 50% 0,rgba(207,168,74,.16),transparent 60%)}
.cert-en{font:600 11px var(--latin);letter-spacing:.28em;color:#8b6a21}
.cert-h{font:800 34px/1.3 var(--serif);letter-spacing:.5em;padding-left:.5em;margin:8px 0 4px;color:#2a2210}
.cert-rank{display:inline-block;font:800 17px var(--serif);color:#fffbe9;background:linear-gradient(180deg,#d9b55a,#8b6a21);padding:3px 24px;letter-spacing:.4em;padding-left:calc(24px + .4em);margin:6px 0 14px}
.cert-name{font:800 clamp(28px,9.5vw,40px)/1.35 var(--serif);border-bottom:1px solid #b08a2e;display:inline-block;padding:0 12px 4px;margin-bottom:16px;word-break:keep-all}
.cert-name small{font-size:.5em;margin-left:.3em}
.cert-body{font:600 15px/2 var(--serif);margin:0 0 12px}
.cert-score{font:700 15px var(--serif);color:#8b6a21;margin-bottom:12px}
.cert-note{font-size:12px;color:#6b5a32;margin:-4px 0 12px;line-height:1.6}
.cert-date,.cert-org{font:600 14px/1.8 var(--serif)}
.seal{width:76px;height:76px;display:block;margin:12px auto 0}
.prize{text-align:center;margin-bottom:20px;width:100%;max-width:440px}
.prize-t{font:700 15px var(--serif);color:var(--gold-l);margin-bottom:10px;letter-spacing:.2em}
.gcard{position:relative;width:100%;max-width:340px;aspect-ratio:1.586;margin:0 auto;border-radius:16px;background:linear-gradient(135deg,#161616 0%,#262626 55%,#121212 100%);border:1px solid var(--gold);padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
.gcard::before{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(207,168,74,.25)}
.gcard::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,240,200,.12) 50%,transparent 65%);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.gc-brand{font:700 18px var(--sans);color:#fff;position:relative}
.gc-brand small{display:block;font:600 10px var(--latin);letter-spacing:.3em;color:var(--gold)}
.gc-amt{font:800 44px/1 var(--latin);background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.gc-foot{display:flex;justify-content:space-between;align-items:flex-end;font:600 10px var(--latin);letter-spacing:.2em;color:var(--mute);position:relative}
.chip{width:40px;height:30px;border-radius:6px;background:var(--metal);opacity:.9}

/* modal / toast */
#modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
.mbox{width:100%;max-width:420px;background:linear-gradient(180deg,#0f3a2b,#06190f);border:1px solid var(--gold);border-radius:18px;padding:24px 20px 12px;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.mbox h3{font:800 20px/1.45 var(--serif);margin:0 0 10px;color:var(--gold-l)}
.mbody{font-size:15px;line-height:1.8;margin-bottom:16px}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%) translateY(20px);z-index:95;background:#0b241b;border:1px solid var(--gold);color:var(--ivory);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* misc */
.ic{display:inline-block;vertical-align:middle;width:1.2em;height:1.2em}
.card h3 .ic{width:22px;height:22px;vertical-align:-4px;margin-right:2px;color:var(--gold)}
.card.center>.ic{width:36px;height:36px;color:var(--gold)}
.onair{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--latin);letter-spacing:.2em;color:#ffd9d2;border:1px solid #a8433c;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.onair i{width:8px;height:8px;border-radius:50%;background:#e0483c;animation:tw 1s infinite}
.script p{margin:0;padding:8px 10px;border-radius:10px;font:700 15px/1.6 var(--serif);color:var(--mute);transition:all .3s}
.script p.on{color:var(--ivory);background:rgba(207,168,74,.14)}
.pts{width:100%;border-collapse:collapse;font-size:15px}
.pts td{padding:10px 4px;border-bottom:1px solid rgba(207,168,74,.15)}
.pts td:last-child{text-align:right;font:800 18px var(--latin);color:var(--gold-l);white-space:nowrap}
.flow{counter-reset:f;list-style:none;padding:0;margin:0}
.flow li{counter-increment:f;position:relative;padding:8px 0 8px 38px;border-bottom:1px solid rgba(207,168,74,.12)}
.flow li:last-child{border-bottom:0}
.flow li::before{content:counter(f);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:50%;border:1px solid var(--gold);color:var(--gold-l);font:700 13px/24px var(--latin);text-align:center}
.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(207,168,74,.12);font-size:15px}
.stat:last-child{border-bottom:0}.stat b{color:var(--gold-l)}
.adm-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(207,168,74,.12)}
.adm-row:last-child{border-bottom:0}
.adm-row .mini{flex:none;padding:0 14px}
.code{font:500 12px/1.5 ui-monospace,Menlo,monospace;word-break:break-all;min-height:110px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>

<div id="toast" role="status"></div>
<script>
(function(){
'use strict';
/* ========== 基本データ ========== */
const NAMES=['たくじ','えり','ひゅうき','あやさ'];
const QS=['毎日使うものですか？','家の中で使うものですか？','手のひらサイズですか？','触った感じは固いですか？','身につけるものですか？','色を選べるものですか？'];
const CH=['はい','いいえ','どちらとも言えない'];
const PH=[
  {label:'第1弾',date:[2026,11,1],md:'12月1日',sh:'12/1',q:[0,1]},
  {label:'第2弾',date:[2026,11,15],md:'12月15日',sh:'12/15',q:[2,3]},
  {label:'第3弾',date:[2026,11,25],md:'12月25日',sh:'12/25',q:[4,5]}
];
const FINAL=[2026,11,25];
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const app=$('#app'),ov=$('#ov');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const phaseOf=qi=>PH.findIndex(p=>p.q.includes(qi));

/* ========== 保存 ========== */
let LS=null;
try{localStorage.setItem('ss26_probe','1');localStorage.removeItem('ss26_probe');LS=localStorage;}catch(e){LS=null;}
const mem={};
const ls={
  get(k){try{return LS?LS.getItem(k):(k in mem?mem[k]:null);}catch(e){return k in mem?mem[k]:null;}},
  set(k,v){try{if(LS){LS.setItem(k,v);}else{mem[k]=v;}return !!LS;}catch(e){mem[k]=v;return false;}},
  del(k){try{if(LS)LS.removeItem(k);}catch(e){}delete mem[k];}
};
let TEST=ls.get('ss26_mode')==='test';
const KEY=()=>TEST?'ss26_test':'ss26_real';
function blank(){
  return {v:1,draw:null,pins:[null,null,null,null],admin:null,
    hints:NAMES.map(()=>({ans:[null,null,null,null,null,null],gift:''})),
    preds:NAMES.map(()=>({to:{},gifts:{},locked:false,at:null})),
    opened:[false,false,false],judge:{},final:{stage:0,winnerShown:false}};
}
function normalize(o){
  const b=blank();if(!o||typeof o!=='object')return b;
  const ok4=a=>Array.isArray(a)&&a.length===4;
  return {v:1,
    draw:(o.draw&&ok4(o.draw.map))?{map:o.draw.map.map(Number),at:o.draw.at||null,seen:ok4(o.draw.seen)?o.draw.seen.map(Boolean):[false,false,false,false]}:null,
    pins:ok4(o.pins)?o.pins:b.pins,admin:o.admin||null,
    hints:ok4(o.hints)?o.hints.map(h=>({ans:(h&&Array.isArray(h.ans)&&h.ans.length===6)?h.ans:[null,null,null,null,null,null],gift:(h&&h.gift)||''})):b.hints,
    preds:ok4(o.preds)?o.preds.map(p=>({to:(p&&p.to)||{},gifts:(p&&p.gifts&&typeof p.gifts==='object')?p.gifts:{},locked:!!(p&&p.locked),at:(p&&p.at)||null})):b.preds,
    opened:(Array.isArray(o.opened)&&o.opened.length===3)?o.opened.map(Boolean):b.opened,
    judge:(o.judge&&typeof o.judge==='object'&&!Array.isArray(o.judge))?o.judge:{},
    final:Object.assign({stage:0,winnerShown:false},o.final||{})};
}
let S=blank();
function load(){const raw=ls.get(KEY());S=blank();if(raw){try{S=normalize(JSON.parse(raw));}catch(e){S=blank();}}}
function save(){
  const cur=ls.get(KEY());
  if(cur)ls.set(KEY()+'_prev',cur);
  if(!ls.set(KEY(),JSON.stringify(S)))toast('この画面では保存できません。Safariで開いてください');
}
load();

/* ========== 日付 ========== */
function now(){
  if(TEST){const d=ls.get('ss26_testdate');if(d){const p=d.split('-').map(Number);const n=new Date();return new Date(p[0],p[1]-1,p[2],n.getHours(),n.getMinutes(),n.getSeconds());}}
  return new Date();
}
const D=a=>new Date(a[0],a[1],a[2]);
const released=i=>now()>=D(PH[i].date);
const finalOpen=()=>now()>=D(FINAL);
function until(a){
  const ms=D(a)-now();if(ms<=0)return null;
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  return d>0?`あと${d}日${h}時間`:`あと${h}時間${m}分`;
}
function daysToFinal(){const t=now();const t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((D(FINAL)-t0)/864e5);}

/* ========== 乱数・抽選 ========== */
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}
function derange(){
  for(;;){
    const p=[0,1,2,3];
    for(let i=3;i>0;i--){const j=rnd(i+1);const t=p[i];p[i]=p[j];p[j]=t;}
    if(p.every((v,i)=>v!==i))return p;
  }
}
function validMap(m){return Array.isArray(m)&&m.length===4&&m.every((v,i)=>v!==i&&v>=0&&v<4)&&new Set(m).size===4;}
function ph(pin){let h=2166136261;const s='ss26:'+pin;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}

/* ========== タイマー管理 ========== */
let TM=[],TIV=null,RUN=0;
function later(fn,ms){TM.push(setTimeout(fn,ms));}
function clearTimers(){TM.forEach(clearTimeout);TM=[];}

/* ========== トースト・モーダル ========== */
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600);}
function modal(title,body,btns){
  const m=$('#modal');
  m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><h3>${title}</h3><div class="mbody">${body}</div><div>${btns.map((b,i)=>`<button class="btn ${b.cls||'btn-ghost'}" data-mb="${i}">${b.label}</button>`).join('')}</div></div>`;
  m.classList.add('on');
  $$('[data-mb]',m).forEach(el=>el.onclick=()=>{const b=btns[+el.dataset.mb];if(b.fn&&b.fn(m)===false)return;if(m.classList.contains('on')&&!b.keep)closeModal();});
}
function closeModal(){const m=$('#modal');m.classList.remove('on');m.innerHTML='';}

/* ========== アイコン ========== */
const IC={
  back:'M15 18l-6-6 6-6',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>',
  book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5V5.5M8 7.5h8M8 11h6"/>',
  dice:'<rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.1"/><circle cx="15" cy="15" r="1.1"/><circle cx="15" cy="9" r="1.1"/><circle cx="9" cy="15" r="1.1"/><circle cx="12" cy="12" r="1.1"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',

  ask:'<path d="M12 21a9 9 0 1 0-8.2-5.3L3 21l5.3-.8A9 9 0 0 0 12 21z"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.3M12 16.8h.01"/>',
  env:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/>',
  trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3.5 4M16 6h3a3 3 0 0 1-3.5 4M12 13v4M8 20.5h8M9.5 17h5"/>',

  stop:'<rect x="6" y="6" width="12" height="12" rx="1.5"/>',
  eyeoff:'<path d="M3 3l18 18M10.6 6.1A9.7 9.7 0 0 1 12 6c6 0 9.5 6 9.5 6a16.6 16.6 0 0 1-3 3.6M6.5 7.6A16.6 16.6 0 0 0 2.5 12s3.5 6 9.5 6a9.6 9.6 0 0 0 4.4-1.1"/>',
  check:'M5 12.5l4.5 4.5L19 7.5',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  gift:'<rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M3 9h18M12 9v11M12 9c-2-4-6-4-6-1.5S10 9 12 9zM12 9c2-4 6-4 6-1.5S14 9 12 9z"/>'
};
function ic(n,cls){const p=IC[n]||'';const body=p.charAt(0)==='M'?`<path d="${p}"/>`:p;return `<svg class="ic ${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;}
const LOCKSVG=`<svg class="biglock" id="biglock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path class="shackle" d="M8 11V8a4 4 0 0 1 8 0v3"/><rect x="5" y="11" width="14" height="10" rx="2"/><circle cx="12" cy="15.5" r="1.3"/><path d="M12 16.8v1.7"/></svg>`;
const TREE=`<svg class="tree" viewBox="0 0 200 232" aria-hidden="true"><defs>
<linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f6d52"/><stop offset="1" stop-color="#082419"/></linearGradient>

<circle class="glow" cx="100" cy="30" r="30" fill="url(#sg)"/>
<path d="M100 108 L170 192 H30 Z" fill="url(#tg)" stroke="url(#gg)" stroke-width="1.4" stroke-linejoin="round"/>

<path d="M76 88 Q100 99 124 84M62 134 Q100 150 140 128M46 184 Q100 202 156 176" stroke="url(#gg)" stroke-width="1" fill="none" opacity=".8"/>
<g fill="url(#gg)"><circle class="orn" cx="86" cy="91" r="3.2"/><circle class="orn" cx="114" cy="89" r="3" style="animation-delay:.6s"/><circle class="orn" cx="72" cy="137" r="3.4" style="animation-delay:1.1s"/><circle class="orn" cx="100" cy="143" r="3.6" style="animation-delay:.3s"/><circle class="orn" cx="128" cy="134" r="3.2" style="animation-delay:1.6s"/><circle class="orn" cx="60" cy="186" r="3.4" style="animation-delay:.9s"/><circle class="orn" cx="86" cy="192" r="3.2" style="animation-delay:1.9s"/><circle class="orn" cx="116" cy="191" r="3.6" style="animation-delay:.2s"/><circle class="orn" cx="142" cy="182" r="3.2" style="animation-delay:1.3s"/></g>

<rect x="91" y="192" width="18" height="16" fill="#2a1f0e" stroke="url(#gg)" stroke-width="1"/>

/* ========== 効果音（Web Audio） ========== */
const AU={ctx:null,on:ls.get('ss26_snd')!=='0',nb:null};
function ac(){
  if(!AU.on)return null;
  try{if(!AU.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AU.ctx=new C();}if(AU.ctx.state==='suspended')AU.ctx.resume();return AU.ctx;}catch(e){return null;}
}
function noiseBuf(c){if(AU.nb)return AU.nb;const b=c.createBuffer(1,Math.floor(c.sampleRate*.6),c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return AU.nb=b;}
function nz(c,t,dur,freq,vol,type){const s=c.createBufferSource();s.buffer=noiseBuf(c);const f=c.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);s.stop(t+dur+.05);}
function tone(c,t,f,dur,type,vol){const o=c.createOscillator();o.type=type||'sawtooth';o.frequency.value=f;const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.setValueAtTime(vol,t+dur*.65);g.gain.exponentialRampToValueAtTime(.0008,t+dur);const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;o.connect(lp);lp.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.05);}
function bell(c,t,f,dur,vol){const o=c.createOscillator();o.type='sine';o.frequency.value=f;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.05);}
function boom(c,t,vol){const o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(38,t+.5);const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+.7);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.75);}
function sfxDrumroll(sec){const c=ac();if(!c)return;const t0=c.currentTime+.02;const n=Math.floor(sec*30);for(let i=0;i<n;i++){nz(c,t0+i/30,.07,1500+Math.random()*500,.05+.28*(i/n));}}
function sfxCymbal(){const c=ac();if(!c)return;const t=c.currentTime+.01;nz(c,t,1.8,7000,.45,'highpass');boom(c,t,.7);}
function sfxBoom(){const c=ac();if(!c)return;boom(c,c.currentTime+.01,.8);nz(c,c.currentTime+.01,.25,900,.25);}
function sfxTick(){const c=ac();if(!c)return;const t=c.currentTime;const o=c.createOscillator();o.type='square';o.frequency.value=1400;const g=c.createGain();g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0008,t+.035);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.05);}
function sfxChime(){const c=ac();if(!c)return;const t=c.currentTime+.02;[1046.5,1318.5,1568,2093].forEach((f,i)=>bell(c,t+i*.11,f,1.6,.14));}
function sfxDing(){const c=ac();if(!c)return;bell(c,c.currentTime+.01,1568,.9,.12);bell(c,c.currentTime+.01,2349,.6,.05);}
function sfxFanfare(){const c=ac();if(!c)return;const t=c.currentTime+.05;const N={G4:392,C5:523.25,E5:659.25,G5:783.99,C6:1046.5};
  [['G4',0,.15],['C5',.17,.15],['E5',.34,.15],['G5',.51,.42],['E5',.96,.15],['G5',1.13,1.5]].forEach(a=>{tone(c,t+a[1],N[a[0]],a[2],'sawtooth',.085);tone(c,t+a[1],N[a[0]]*2,a[2],'square',.02);});
  ['C5','E5','G5','C6'].forEach(n=>tone(c,t+1.13,N[n],1.5,'triangle',.06));nz(c,t+1.13,1.4,6500,.22,'highpass');boom(c,t+1.13,.5);}

const SP={ok:'speechSynthesis' in window,voice:null,male:false,on:false};
const MALE=/otoya|hattori|ichiro|keita|daichi|naoki|takeshi|male|男性/i;
function pickVoice(){if(!SP.ok)return;let vs=[];try{vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));}catch(e){}SP.voice=vs.find(v=>MALE.test(v.name))||vs[0]||null;SP.male=!!(SP.voice&&MALE.test(SP.voice.name));}
if(SP.ok){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
function unlockAudio(){
  /* iPhoneはタップした瞬間に一度鳴らさないと、あとから音声・効果音を出せないため */
  const c=ac();
  if(c){try{const b=c.createBuffer(1,1,22050);const s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0);}catch(e){}}
  if(SP.ok){try{pickVoice();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('　');u.lang='ja-JP';u.volume=0;speechSynthesis.speak(u);}catch(e){}}
}
function stopSpeech(){RUN++;if(SP.ok){try{speechSynthesis.cancel();}catch(e){}}}
function sayLine(text,shown){
  return new Promise(res=>{
    const wait=Math.max(1500,(shown||text).length*125);
    if(!SP.ok||!SP.on||!AU.on){setTimeout(res,wait);return;}
    let done=false;const fin=()=>{if(!done){done=true;res();}};
    try{
      const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';if(SP.voice)u.voice=SP.voice;
      u.rate=1.12;u.pitch=SP.male?1.2:.78;u.volume=1;u.onend=fin;u.onerror=fin;
      setTimeout(fin,2500+text.length*280);speechSynthesis.speak(u);
    }catch(e){setTimeout(fin,wait);}
  });
}

/* ========== 光の粒子・雪 ========== */
(function(){
  const c=$('#fx'),x=c.getContext('2d');let W=0,H=0,P=[];
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){const d=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);}
  size();addEventListener('resize',size);
  const N=reduce?0:46;
  for(let i=0;i<N;i++)P.push(mk(true));
  function mk(init){const snow=Math.random()<.45;return{snow,x:Math.random()*W,y:init?Math.random()*H:(snow?-10:H+10),r:snow?1+Math.random()*1.8:.6+Math.random()*1.6,vy:snow?.25+Math.random()*.55:-(.12+Math.random()*.3),vx:(Math.random()-.5)*.25,ph:Math.random()*6.28};}
  function tick(){
    if(!document.hidden){
      x.clearRect(0,0,W,H);
      for(const p of P){p.y+=p.vy;p.x+=p.vx+Math.sin(p.ph+=.012)*.15;
        if(p.y>H+12||p.y<-12){Object.assign(p,mk(false));}
        const a=p.snow?.55:(.35+.45*Math.abs(Math.sin(p.ph*1.6)));
        x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);
        x.fillStyle=p.snow?`rgba(244,238,223,${a*.7})`:`rgba(242,214,140,${a})`;
        if(!p.snow){x.shadowColor='rgba(242,214,140,.9)';x.shadowBlur=6;}else{x.shadowBlur=0;}
        x.fill();}
      x.shadowBlur=0;
    }
    requestAnimationFrame(tick);
  }
  if(N)requestAnimationFrame(tick);
})();

/* ========== 紙吹雪 ========== */
const CF=(function(){
  const c=$('#confetti'),x=c.getContext('2d');let W=0,H=0,parts=[],run=false;
  function size(){const d=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);}
  size();addEventListener('resize',size);
  const cols=['#f7e7b4','#e3c26e','#cfa84a','#a67c2a','#f4eedf','#1f6d52','#d9b55a'];
  function add(o){parts.push(Object.assign({w:5+Math.random()*6,h:8+Math.random()*10,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)],life:0,g:.16+Math.random()*.08,sh:Math.random()<.25?1:0},o));}
  function tick(){
    x.clearRect(0,0,W,H);
    parts=parts.filter(p=>p.y<H+30&&p.life<420);
    for(const p of parts){p.life++;p.vx*=.985;p.vy=Math.min(p.vy+p.g,4.2);p.x+=p.vx+Math.sin(p.life*.06)*.6;p.y+=p.vy;p.r+=p.vr;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.cos(p.life*.12));x.fillStyle=p.c;
      if(p.sh){x.beginPath();x.arc(0,0,p.w*.45,0,6.283);x.fill();}else{x.fillRect(-p.w/2,-p.h/2,p.w,p.h);}x.restore();}
    if(parts.length){requestAnimationFrame(tick);}else{run=false;x.clearRect(0,0,W,H);}
  }
  function go(){if(!run){run=true;requestAnimationFrame(tick);}}
  return{
    burst(n,o){o=o||{};const cx=o.x!=null?o.x:W/2,cy=o.y!=null?o.y:H*.38;for(let i=0;i<(n||150);i++){const a=Math.random()*6.283,s=4+Math.random()*9;add({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5});}go();},
    rain(n){for(let i=0;i<(n||160);i++)add({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*2,vy:1+Math.random()*2});go();}
  };
})();

function pinPad(el,o){
  let v='',err='';
  const draw=()=>{
    el.innerHTML=`<div class="pinwrap"><div class="pin-title">${o.title}</div>${o.note?`<p class="pin-note">${o.note}</p>`:''}${err?`<p class="pin-err">${err}</p>`:''}<div class="pin-dots${err?' shake':''}">${[0,1,2,3].map(i=>`<i class="${i<v.length?'on':''}">${i<v.length?'＊':''}</i>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button class="fn" data-k="c">やめる</button><button data-k="0">0</button><button class="fn" data-k="b">1字消す</button></div></div>`;
    $$('[data-k]',el).forEach(b=>b.onclick=()=>press(b.dataset.k));
  };
  const press=k=>{
    if(k==='c'){if(o.onCancel)o.onCancel();return;}

  };
  draw();
}

/* ========== スコア ========== */
function scores(){
  return NAMES.map((n,p)=>{
    let rec=0;const detail=[];
    for(let g=0;g<4;g++){if(g===p)continue;const guess=S.preds[p].to[g];const has=guess!==undefined&&guess!==null&&guess!=='';const ok=!!(S.draw&&has&&Number(guess)===S.draw.map[g]);if(ok)rec+=2;detail.push({g,guess:has?Number(guess):null,ok});}
    let gift=0;const gd=[];
    for(let g=0;g<4;g++){if(g===p)continue;const j=S.judge[p+'-'+g];const pt=j==='hit'?3:j==='near'?1:0;gift+=pt;gd.push({g,j:j||null,pt});}
    return {p,rec,gift,total:rec+gift,detail,gd};
  });
}
function ranking(){const sc=scores();sc.forEach(s=>{s.rank=1+sc.filter(o=>o.total>s.total).length;});return sc.sort((a,b)=>a.rank-b.rank||b.gift-a.gift||a.p-b.p);}
function winners(){
  const sc=scores();const max=Math.max.apply(null,sc.map(s=>s.total));
  let top=sc.filter(s=>s.total===max),tb=false;
  if(top.length>1){const mg=Math.max.apply(null,top.map(s=>s.gift));const t2=top.filter(s=>s.gift===mg);if(t2.length<top.length)tb=true;top=t2;}
  return {list:top,tiebreak:tb,max};
}

  const who=g=>whoScreen(g,{en:'HINT ANSWER',jp:'ヒントの回答入力'},()=>{shell(head('HINT ANSWER','ヒントの回答入力')+`<div id="pp"></div>`);personAuth(g,$('#pp'),{allowSet:false,onOk:()=>form(g),onCancel:list});},list);
  const form=g=>{
    const h=S.hints[g];const ans=h.ans.slice();
    shell(head('HINT ANSWER',`${NAMES[g]}さんの回答`,S.draw?`${NAMES[S.draw.map[g]]}さんへ贈るプレゼントについて答えてください`:'')+
      `<div class="card">${QS.map((q,qi)=>{const lk=released(phaseOf(qi));return `<div class="qblock"><div class="qh"><span class="qn">Q${qi+1}</span>${q}</div><div class="opts">${CH.map((c,ci)=>`<button class="ch ${ans[qi]===ci?'on':''}" data-q="${qi}" data-c="${ci}" ${lk?'disabled':''}>${c}</button>`).join('')}</div>${lk?'<div class="lockmsg">公開済みのため変更できません</div>':`<div class="lockmsg">${PH[phaseOf(qi)].md}に公開</div>`}</div>`;}).join('')}</div>
      <div class="card"><label class="lb" for="gift">贈るプレゼントの中身（最終発表まで秘密）</label><input class="inp" id="gift" maxlength="40" value="${esc(h.gift)}" placeholder="例：〇〇のマグカップ"><p class="fine" style="margin-top:8px">最終発表で「実際のプレゼント」として表示され、判定に使います。</p></div>
      <button class="btn btn-gold" id="sv">${ic('check')}保存して画面を隠す</button><button class="btn btn-ghost" id="cn">保存せずに戻る</button>`);
    $$('.ch[data-q]').forEach(b=>b.onclick=()=>{const q=+b.dataset.q,c=+b.dataset.c;ans[q]=c;$$(`.ch[data-q="${q}"]`).forEach(x=>x.classList.toggle('on',+x.dataset.c===c));sfxTick();});
    $('#sv').onclick=()=>{ans.forEach((a,qi)=>{if(!released(phaseOf(qi)))h.ans[qi]=a;});h.gift=$('#gift').value.trim();save();hideScreen('ヒントの回答を保存しました',()=>vHints());};
    $('#cn').onclick=()=>hideScreen('入力内容は保存していません',()=>vHints());
  };
  list();
}

/* ========== スケジュール ========== */
function vSchedule(){
  const np=PH.findIndex((p,i)=>!released(i));
  shell(head('SCHEDULE','ヒント公開スケジュール')+
    (np>=0?`<div class="card center"><h3>${PH[np].label}の公開まで</h3><div class="live" id="live"></div><p class="fine" style="margin-top:10px">${PH[np].md} 0:00 に開封できるようになります</p></div>`:`<div class="notice">すべてのヒントが公開されました</div>`)+
    `<div class="tl">${PH.map((p,i)=>{const r=released(i);return `<div class="tli ${r?'done':''}"><div class="card"><div class="dt">${p.sh.replace('/','.')}</div><h3 style="margin-top:6px">${p.label}<span class="tag ${r?'on':''}">${r?(S.opened[i]?'公開済み':'開封できます'):'未公開'}</span></h3><p>Q${p.q[0]+1}「${QS[p.q[0]]}」<br>Q${p.q[1]+1}「${QS[p.q[1]]}」の回答を公開</p>${i===2?'<p class="fine">同じ日に最終予想・組み合わせ発表・プレゼント交換・優勝者発表</p>':''}</div></div>`;}).join('')}</div>
    <a class="btn btn-line" href="#hints">${ic('search')}ヒント一覧へ</a>`);
  if(np>=0){
    const tick=()=>{const el=$('#live');if(!el){clearInterval(TIV);return;}let ms=Math.max(0,D(PH[np].date)-now());if(ms<=0){clearInterval(TIV);render();return;}const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);el.innerHTML=[[d,'日'],[h,'時間'],[m,'分'],[s,'秒']].map(a=>`<div><b>${String(a[0]).padStart(2,'0')}</b><span>${a[1]}</span></div>`).join('');};
    tick();TIV=setInterval(tick,1000);
  }
}

/* ========== 推理・予想 ========== */
const T_PRED={en:'PREDICTION',jp:'推理・予想'};
function vPredict(){
  const list=()=>{shell(head(T_PRED.en,T_PRED.jp,'誰が、誰に、何を贈るのか')+`<div class="card"><h3>予想すること</h3><p>自分以外の3人それぞれについて予想します。</p><p>① <b>誰に贈るか</b>（的中1人につき2点）</p><p>② <b>プレゼントの中身</b>（的中3点・ジャンルが同じなら1点）</p><p class="fine">「下書き保存」なら何度でも変更できます。「予想を確定する」を押すと固定されます（修正は管理者のみ）。<br>予想はあいことばがないと開けません。</p></div><p class="lead">予想する人を選んでください</p>`+nameGrid(p=>{const pr=S.preds[p];return pr.locked?{done:true,text:'確定済み'}:(Object.keys(pr.to).length||Object.keys(pr.gifts).length)?{text:'下書き保存中'}:{text:'まだ予想していません'};}));$$('[data-p]').forEach(b=>b.onclick=()=>who(+b.dataset.p));};
  const who=p=>whoScreen(p,T_PRED,()=>{shell(head(T_PRED.en,T_PRED.jp)+`<div id="pp"></div>`);personAuth(p,$('#pp'),{allowSet:false,onOk:()=>form(p),onCancel:list});},list);
  const form=p=>{
    const pr=S.preds[p];
    if(pr.locked){
      shell(head(T_PRED.en,`${NAMES[p]}さんの予想`)+`<div class="notice">この予想は確定済みです</div>${[0,1,2,3].filter(g=>g!==p).map(g=>`<div class="card"><h3>${ic('gift')} ${NAMES[g]}さんの予想</h3><div class="stat"><span>贈る相手</span><b>${pr.to[g]!=null?(Number(pr.to[g])===p?'わたし':NAMES[pr.to[g]]+'さん'):'未入力'}</b></div><div class="stat"><span>プレゼント</span><b>${esc(pr.gifts[g])||'未入力'}</b></div></div>`).join('')}<p class="fine center">修正が必要なときは、管理者メニューでロックを解除してもらってください。</p><button class="btn btn-gold" id="cl">${ic('eyeoff')}画面を隠す</button>`);
      $('#cl').onclick=()=>hideScreen('',list);return;
    }
    const to=Object.assign({},pr.to);
    shell(head(T_PRED.en,`${NAMES[p]}さんの予想`)+
      `<p class="fine center">3人のうち1人は、あなたに贈っています。</p>${[0,1,2,3].filter(g=>g!==p).map(g=>`<div class="card"><h3>${ic('gift')} ${NAMES[g]}さんが贈るプレゼント</h3><div class="qblock"><div class="qh">① 贈る相手は？</div><div class="opts">${[0,1,2,3].filter(r=>r!==g).map(r=>`<button class="ch ${to[g]!=null&&Number(to[g])===r?'on':''}" data-g="${g}" data-r="${r}">${r===p?'わたし':NAMES[r]}</button>`).join('')}</div></div><div class="qblock"><label class="qh" for="pg${g}" style="display:block">② 中身は何？</label><input class="inp" id="pg${g}" data-pg="${g}" maxlength="40" placeholder="例：ハンドクリーム" value="${esc(pr.gifts[g])}"></div></div>`).join('')}
      <button class="btn btn-gold" id="fix">${ic('lock')}予想を確定する</button><button class="btn btn-line" id="dr">下書き保存して画面を隠す</button><button class="btn btn-ghost" id="cn">保存せずに戻る</button>`);
    $$('.ch[data-g]').forEach(b=>b.onclick=()=>{const g=+b.dataset.g,r=+b.dataset.r;to[g]=r;$$(`.ch[data-g="${g}"]`).forEach(x=>x.classList.toggle('on',+x.dataset.r===r));sfxTick();});
    const store=()=>{pr.to=to;const gs={};$$('[data-pg]').forEach(i=>{const v=i.value.trim();if(v)gs[i.dataset.pg]=v;});pr.gifts=gs;};
    $('#dr').onclick=()=>{store();save();hideScreen('下書きを保存しました',list);};
    $('#cn').onclick=()=>hideScreen('入力内容は保存していません',list);
    $('#fix').onclick=()=>{
      const miss=[0,1,2,3].filter(g=>g!==p&&to[g]==null);const gmiss=$$('[data-pg]').filter(i=>!i.value.trim());
      if(miss.length||gmiss.length){toast('3人分の「贈る相手」と「中身」をすべて入力してから確定してください');return;}
      modal('予想を確定しますか？','確定すると、自分では変更できなくなります。<br>（修正は管理者のみ可能）',[{label:'確定する',cls:'btn-gold',fn:()=>{store();pr.locked=true;pr.at=new Date().toISOString();save();sfxChime();hideScreen('予想を確定しました',list);}},{label:'やめる'}]);
    };
  };
  list();
}

/* ========== 最終結果発表 ========== */
function pairsHTML(anim){return `<div class="pairs ${anim?'anim':''}">${[0,1,2,3].map(g=>{const r=S.draw.map[g];return `<div class="pair"><span class="nm">${NAMES[g]}</span><span class="ar">→</span><span class="nm">${NAMES[r]}</span><div class="gift"><span class="small-lbl">プレゼント</span><b>${esc(S.hints[g].gift)||'（未入力）'}</b></div></div>`;}).join('')}</div>`;}
function vFinal(){
  const ready=S.draw&&S.draw.seen.every(Boolean);
  if(S.final.stage<1){
    const lockedN=S.preds.filter(p=>p.locked).length,giftN=S.hints.filter(h=>h.gift).length;
    let body=`<div class="card"><h3>発表前チェック</h3><div class="stat"><span>12月25日になっている</span><b>${finalOpen()?'OK':'まだ'}</b></div><div class="stat"><span>全員が抽選結果を確認</span><b>${S.draw?S.draw.seen.filter(Boolean).length:0}/4</b></div><div class="stat"><span>第3弾ヒントを開封</span><b>${S.opened[2]&&released(2)?'OK':'まだ'}</b></div><div class="stat"><span>予想を確定した人</span><b>${lockedN}/4</b></div><div class="stat"><span>プレゼント名の入力</span><b>${giftN}/4</b></div></div>`;
    if(!finalOpen())body+=`<div class="card center">${ic('lock')}<p style="margin-top:8px">最終結果発表は <b>12月25日</b> に解禁されます。<br>${until(FINAL)||''}</p></div>`;
    else if(!ready)body+=`<div class="card center"><p>まだ抽選結果を確認していない人がいます。<br>4人全員が確認するまで最終結果は表示できません。</p><a class="btn btn-line" href="#draw">秘密の抽選へ</a></div>`;
    else body+=`<button class="btn btn-gold" id="start">${ic('play')}最終発表スタート</button><p class="fine center">全員で画面を見ながら押してください。<br>スタートには管理者（たくじ）のあいことばが必要です。</p>`;
    shell(head('FINAL','最終結果発表','運命の組み合わせ、ついに公開')+body);
    const st=$('#start');
    if(st)st.onclick=()=>requireAdmin('最終発表のスタートには、管理者（たくじ）のあいことばが必要です',()=>{
      vFinal();
      const go=()=>revealPairs();
      const warn=[];if(!(S.opened[2]&&released(2)))warn.push('第3弾のヒントがまだ開封されていません。');if(lockedN<4)warn.push(`予想を確定していない人がいます（${4-lockedN}人）。入力済みの内容で採点されます。`);
      if(warn.length)modal('このまま発表しますか？',warn.join('<br>'),[{label:'発表する',cls:'btn-gold',fn:go},{label:'戻る'}]);else go();
    },vFinal);
    return;
  }
  const allJ=allJudged();
  let html=head('FINAL','最終結果発表')+`<div class="card"><h3>運命の組み合わせ</h3>${pairsHTML(false)}</div><button class="btn btn-ghost" id="replay">組み合わせ発表をもう一度見る</button>`;
  if(S.final.stage<3){
    if(!isAdmin()){
      html+=`<div class="card center"><h3>プレゼント判定</h3><p>予想と実際のプレゼントを見比べて、的中・惜しい・ハズレを判定します。判定は管理者（たくじ）が行います。</p></div><button class="btn btn-gold" id="adm">${ic('key')}判定を始める（管理者）</button><div id="pp"></div>`;
    }else{
      const sc=scores();const done=JKEYS.filter(k=>S.judge[k]).length;
      html+=`<div class="card"><h3>プレゼント判定</h3><p class="fine">プレゼントごとに、3人の予想を判定します。ジャンルが同じなら「惜しい」です。</p><div class="stat"><span>判定済み</span><b>${done}/12</b></div></div>`+[0,1,2,3].map(g=>{const r=S.draw.map[g];return `<div class="card judge"><h3>${ic('gift')} ${NAMES[g]}さん → ${NAMES[r]}さん</h3><div class="cmp"><span class="k">実際のプレゼント</span><b>${esc(S.hints[g].gift)||'（未入力）'}</b></div>${[0,1,2,3].filter(p=>p!==g).map(p=>{const d=sc[p].detail.find(x=>x.g===g);const k=p+'-'+g;return `<div class="qblock"><div class="qh">${NAMES[p]}さんの予想</div><div class="cmp" style="margin-top:0"><span class="k">贈る相手：${d.guess===null?'未入力':(d.guess===p?NAMES[p]+'（本人）':NAMES[d.guess])}　<b style="color:${d.ok?'#8fe0b9':'var(--mute)'}">${d.ok?'的中 +2':'ハズレ'}</b></span>${esc(S.preds[p].gifts[g])||'（中身の予想なし）'}</div><div class="row3">${[['hit','的中 3点'],['near','惜しい 1点'],['miss','ハズレ 0点']].map(a=>`<button class="ch ${S.judge[k]===a[0]?'on':''}" data-j="${k}" data-v="${a[0]}">${a[1]}</button>`).join('')}</div></div>`;}).join('')}</div>`;}).join('')+
      `<div class="card"><h3>現在の合計点</h3>${sc.map(x=>`<div class="stat"><span>${NAMES[x.p]}さん（贈り先 ${x.rec}点＋中身 ${x.gift}点）</span><b>${x.total}点</b></div>`).join('')}</div>`+
      `<button class="btn btn-gold" id="rk" ${allJ?'':'disabled'}>${ic('trophy')}ランキング発表へ</button>${allJ?'':'<p class="fine center">12件すべての判定が終わると押せます</p>'}`;
    }
  }else{
    html+=rankStatic()+`<button class="btn btn-gold" id="rk">ランキング発表をもう一度見る</button><a class="btn btn-line" href="#winner">${ic('trophy')}優勝者発表へ</a>`;
  }
  shell(html);
  $('#replay').onclick=revealPairs;
  const adm=$('#adm');if(adm)adm.onclick=()=>{adm.remove();adminAuth($('#pp'),vFinal,vFinal);};
  $$('[data-j]').forEach(b=>b.onclick=()=>{S.judge[b.dataset.j]=b.dataset.v;save();sfxTick();const y=scrollY;vFinal();scrollTo(0,y);});
  const rk=$('#rk');if(rk)rk.onclick=()=>{if(allJudged())revealRanking();};
}
function rankStatic(){const rk=ranking();return `<div class="card"><h3>最終ランキング</h3>${rk.map(s=>{const tie=rk.filter(o=>o.rank===s.rank).length>1;return `<div class="rank-row ${s.rank===1?'first':''}"><span class="rk">${s.rank}位${tie?'<small>同率</small>':''}</span><span class="rn">${NAMES[s.p]}<small>贈り先 ${s.rec}点＋中身 ${s.gift}点</small></span><span class="rp">${s.total}<small>点</small></span></div>`;}).join('')}</div>`;}
function revealPairs(){
  unlockAudio();ov.className='on';
  ov.innerHTML=`<div class="ovc"><div class="cc">FINAL</div><div class="fin-t" id="ft">運命の組み合わせ発表</div><div id="fs"></div><div id="fb"></div></div>`;
  sfxDrumroll(3.2);
  later(()=>{let n=3;const cd=()=>{const fs=$('#fs');if(!fs)return;fs.innerHTML=`<div class="cd">${n}</div>`;sfxBoom();n--;if(n>0)later(cd,950);else later(show,950);};cd();},3300);
  const show=()=>{
    ov.classList.add('lit');
    ov.insertAdjacentHTML('afterbegin','<div class="spot l"></div><div class="spot r"></div><div class="spot c"></div><div class="floor"></div>');
    requestAnimationFrame(()=>ov.classList.add('lit'));
    $('#ft').textContent='4人の組み合わせはこちら！';
    $('#fs').innerHTML=pairsHTML(true);
    sfxCymbal();later(sfxFanfare,300);CF.burst(200,{y:innerHeight*.3});later(()=>CF.rain(220),400);
    if(S.final.stage<1){S.final.stage=1;save();}
    later(()=>{const fb=$('#fb');if(fb){fb.innerHTML=`<div style="height:18px"></div><button class="btn btn-gold" id="nx">${S.final.stage>=3?'閉じる':'次へ：プレゼント判定'}</button>`;$('#nx').onclick=()=>{closeOv();vFinal();window.scrollTo(0,0);};}},1600);
  };
}
function revealRanking(){
  unlockAudio();const rk=ranking().slice().reverse();
  ov.className='on';
  ov.innerHTML=`<div class="spot l"></div><div class="spot r"></div><div class="floor"></div><div class="ovc"><div class="cc">RANKING</div><div class="fin-t">最終ランキング発表</div><div id="rr">${rk.map((s,i)=>{const tie=rk.filter(o=>o.rank===s.rank).length>1;return `<div class="rank-row hid ${s.rank===1?'first':''}" data-i="${i}"><span class="rk">${s.rank}位${tie?'<small>同率</small>':''}</span><span class="rn">${NAMES[s.p]}<small>贈り先 ${s.rec}点＋中身 ${s.gift}点</small></span><span class="rp">${s.total}<small>点</small></span></div>`;}).join('')}</div><div id="rb"></div></div>`;
  later(()=>ov.classList.add('lit'),100);
  const rows=$$('#rr .rank-row');let t=600;
  rows.forEach((r,i)=>{const isTop=rk[i].rank===1;if(isTop&&!(i>0&&rk[i-1].rank===1)){later(()=>sfxDrumroll(2.4),t);t+=2600;}const at=t;later(()=>{r.classList.remove('hid');r.classList.add('show');if(isTop){sfxCymbal();CF.burst(140,{y:innerHeight*.35});}else sfxBoom();},at);t+=isTop?300:1300;});
  later(()=>{sfxFanfare();S.final.stage=3;save();const rb=$('#rb');if(rb){rb.innerHTML=`<div style="height:12px"></div><a class="btn btn-gold" href="#winner" id="tw">${ic('trophy')}優勝者発表へ</a><button class="btn btn-ghost" id="rc">閉じる</button>`;$('#tw').onclick=()=>closeOv();$('#rc').onclick=()=>{closeOv();vFinal();};}},t+400);
}

/* ========== 優勝者発表 ========== */

  <div class="prize"><div class="prize-t">— 優勝賞品 —</div><div class="gcard"><div class="gc-brand"><small>GIFT CARD</small>Amazonギフトカード</div><div class="gc-amt">¥3,000</div><div class="gc-foot"><span class="chip"></span><span>SECRET SANTA 2026</span></div></div>${co?`<p class="fine" style="margin-top:10px">山分け：1人あたり ${share}円分</p>`:''}</div>`;
}
function vWinner(){
  if(S.final.stage<3){
    shell(head('CHAMPION','優勝者発表')+`<div class="card center">${ic('lock')}<p style="margin-top:8px">優勝者発表は、最終結果発表でランキングを発表したあとに解禁されます。</p></div><a class="btn btn-line" href="#final">${ic('env')}最終結果発表へ</a>`);
    return;
  }
  shell(head('CHAMPION','優勝者発表')+(S.final.winnerShown?certHTML():`<div class="card center"><p>いよいよ、SECRET SANTA 2026 の頂点が決まります。</p></div>`)+`<button class="btn btn-gold" id="wgo">${ic('trophy')}${S.final.winnerShown?'表彰式をもう一度':'優勝者を発表する'}</button>`);
  $('#wgo').onclick=ceremony;
}

  later(()=>{
    ov.insertAdjacentHTML('afterbegin','<div class="spot l"></div><div class="spot r"></div><div class="spot c"></div><div class="floor"></div>');
    requestAnimationFrame(()=>ov.classList.add('lit'));
    const wc=$('#wc');if(!wc)return;
    wc.innerHTML=`<div class="cc">CHAMPION</div><div class="whoname" style="font-size:clamp(36px,12vw,54px)">${w.list.map(s=>`<div>${NAMES[s.p]}<span>さん</span></div>`).join('')}</div><div class="fin-t">おめでとうございます！</div>`+certHTML()+`<button class="btn btn-gold" id="wx">閉じる</button>`;
    sfxCymbal();later(sfxFanfare,250);CF.burst(220,{y:innerHeight*.3});later(()=>CF.rain(260),500);later(()=>CF.rain(200),2600);
    S.final.winnerShown=true;save();
    $('#wx').onclick=()=>{closeOv();vWinner();};
  },3600);
}

/* ========== 管理者 ========== */
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s)));}
function makeCode(){return 'SS26-'+b64e(JSON.stringify({k:'ss26',t:Date.now(),d:S})).split('').reverse().join('');}
function readCode(c){c=(c||'').trim().replace(/\s+/g,'');if(c.indexOf('SS26-')!==0)throw new Error('x');const o=JSON.parse(b64d(c.slice(5).split('').reverse().join('')));if(o.k!=='ss26'||!o.d)throw new Error('x');const n=normalize(o.d);if(n.draw&&!validMap(n.draw.map))throw new Error('x');return n;}
function vAdmin(){
  if(!isAdmin()){shell(head('ADMIN','管理者メニュー','管理者：たくじさん')+`<div id="pp"></div>`);adminAuth($('#pp'),vAdmin,()=>{location.hash='top';});return;}
  const seen=S.draw?S.draw.seen.filter(Boolean).length:0;
  shell(head('ADMIN','管理者メニュー','管理者：たくじさん')+
  `<div class="card"><h3>進行状況</h3><div class="stat"><span>抽選</span><b>${S.draw?`確定済み（確認 ${seen}/4）`:'未抽選'}</b></div>${NAMES.map((n,i)=>`<div class="stat"><span>${n}さん ヒント回答</span><b>${S.hints[i].ans.filter(a=>a!==null&&a!==undefined).length}/6・品名${S.hints[i].gift?'あり':'なし'}</b></div>`).join('')}<div class="stat"><span>予想の確定</span><b>${S.preds.filter(p=>p.locked).length}/4</b></div><div class="stat"><span>最終発表</span><b>${['未発表','組み合わせ発表済み','—','ランキング発表済み'][S.final.stage]||''}</b></div></div>
  <div class="card"><h3>予想の修正（ロック解除）</h3>${NAMES.map((n,i)=>`<div class="adm-row"><span>${n}さん：${S.preds[i].locked?'確定済み':'未確定'}</span>${S.preds[i].locked?`<button class="mini" data-unlock="${i}">ロック解除</button>`:''}</div>`).join('')}<p class="fine" style="margin-top:8px">解除すると、本人が再び予想を編集・確定できます。</p></div>
  <div class="card"><h3>あいことばのリセット</h3>${NAMES.map((n,i)=>`<div class="adm-row"><span>${n}さん：${S.pins[i]?'設定済み':'未設定'}</span>${S.pins[i]?`<button class="mini" data-rpin="${i}">リセット</button>`:''}</div>`).join('')}<p class="fine" style="margin-top:8px">リセット後は、本人が「秘密の抽選」で自分の結果を再確認するときに新しいあいことばを決めます。抽選結果は変わりません。</p></div>
  <div class="card"><h3>バックアップ・復元</h3><p class="fine">抽選結果を含む全データを1つのコードにまとめます。メモアプリなどに保存しておけば、データが消えても復元できます。<b>中身を他の人に見せないでください。</b></p><button class="btn btn-line" id="bk">${ic('copy')}バックアップコードをコピー</button><textarea class="inp code" id="bkt" readonly placeholder="ここにコードが表示されます"></textarea><div style="height:14px"></div><label class="lb" for="rst">復元するコードを貼り付け</label><textarea class="inp code" id="rst" placeholder="SS26- から始まるコード"></textarea><div style="height:10px"></div><button class="btn btn-line" id="rsb">このコードから復元する</button><button class="btn btn-ghost" id="prev">1つ前の保存状態に戻す</button>${!S.draw&&ls.get(KEY()+'_drawbak')?'<button class="btn btn-ghost" id="dbk">確定時の抽選結果の控えから復元</button>':''}</div>
  <div class="card"><h3>最終発表のやり直し</h3><p class="fine">組み合わせ発表・判定・ランキングを発表前の状態に戻します。抽選結果・ヒント・予想は消えません。</p><button class="btn btn-ghost" id="frs">最終発表を発表前に戻す</button></div>
  <div class="card"><h3>全データのリセット</h3><p class="fine">抽選結果・ヒント・予想・あいことばをすべて消去します。元に戻せません。${TEST?'（テストモードのデータのみ）':''}</p><button class="btn btn-danger" id="all">全データをリセット</button></div>
  <button class="btn btn-ghost" id="lo">管理者メニューを閉じる</button>`);
  $$('[data-unlock]').forEach(b=>b.onclick=()=>{const i=+b.dataset.unlock;modal('ロックを解除',`${NAMES[i]}さんの予想のロックを解除しますか？`,[{label:'解除する',cls:'btn-gold',fn:()=>{S.preds[i].locked=false;save();toast('ロックを解除しました');vAdmin();}},{label:'キャンセル'}]);});
  $$('[data-rpin]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rpin;modal('あいことばをリセット',`${NAMES[i]}さんのあいことばをリセットしますか？`,[{label:'リセットする',cls:'btn-gold',fn:()=>{S.pins[i]=null;save();toast('リセットしました');vAdmin();}},{label:'キャンセル'}]);});
  $('#bk').onclick=()=>{const c=makeCode();const t=$('#bkt');t.value=c;const done=()=>toast('コピーしました。メモアプリなどに貼り付けて保存してください');try{navigator.clipboard.writeText(c).then(done,()=>{t.select();toast('長押しで全選択してコピーしてください');});}catch(e){t.select();toast('長押しで全選択してコピーしてください');}};
  $('#rsb').onclick=()=>{let n;try{n=readCode($('#rst').value);}catch(e){toast('コードが正しくありません');return;}modal('この内容で復元しますか？',`抽選：${n.draw?'あり':'なし'}<br>確定済みの予想：${n.preds.filter(p=>p.locked).length}人<br>現在のデータは上書きされます。`,[{label:'復元する',cls:'btn-gold',fn:()=>{S=n;save();toast('復元しました');vAdmin();}},{label:'キャンセル'}]);};
  $('#prev').onclick=()=>{const raw=ls.get(KEY()+'_prev');if(!raw){toast('前の保存状態がありません');return;}modal('1つ前の状態に戻す','最後の保存の直前の状態に戻します。',[{label:'戻す',cls:'btn-gold',fn:()=>{try{const n=normalize(JSON.parse(raw));const cur=ls.get(KEY());S=n;ls.set(KEY(),JSON.stringify(S));if(cur)ls.set(KEY()+'_prev',cur);toast('戻しました');vAdmin();}catch(e){toast('復元できませんでした');}}},{label:'キャンセル'}]);};
  const dbk=$('#dbk');if(dbk)dbk.onclick=()=>{try{const d=JSON.parse(ls.get(KEY()+'_drawbak'));if(!validMap(d.map))throw 0;S.draw={map:d.map,at:d.at,seen:[false,false,false,false]};save();toast('抽選結果を復元しました');vAdmin();}catch(e){toast('復元できませんでした');}};
  $('#frs').onclick=()=>modal('最終発表を戻す','発表前の状態に戻しますか？',[{label:'戻す',cls:'btn-gold',fn:()=>{S.final={stage:0,winnerShown:false};S.judge={};save();toast('発表前に戻しました');vAdmin();}},{label:'キャンセル'}]);
  $('#all').onclick=()=>modal('本当にリセットしますか？','確認のため、下の欄に <b>リセット</b> と入力してください。<div style="height:10px"></div><input class="inp" id="cf" autocomplete="off">',[{label:'すべて消去する',cls:'btn-danger',fn:m=>{if($('#cf',m).value.trim()!=='リセット'){toast('「リセット」と入力してください');return false;}const cur=ls.get(KEY());if(cur)ls.set(KEY()+'_prev',cur);S=blank();ls.set(KEY(),JSON.stringify(S));ls.del(KEY()+'_drawbak');adminAt=0;toast('リセットしました（直前の状態は「1つ前に戻す」で復元可能）');location.hash='top';}},{label:'キャンセル'}]);
  $('#lo').onclick=()=>{adminAt=0;location.hash='top';};
}

/* ========== ルーター ========== */
const ROUTES={top:vMenu,opening:vOpening,rules:vRules,draw:vDraw,hints:()=>vHints(),schedule:vSchedule,predict:vPredict,final:vFinal,winner:vWinner,admin:vAdmin};
function render(){
  stopSpeech();clearTimers();clearInterval(TIV);closeModal();ov.className='';ov.innerHTML='';
  const h=(location.hash||'').slice(1)||'top';
  (ROUTES[h]||vMenu)();window.scrollTo(0,0);
}
addEventListener('hashchange',render);
addEventListener('storage',e=>{if(e.key&&e.key.indexOf('ss26')===0){load();}});

/* ========== 起動時の演出 ========== */
function intro(){
  const el=document.createElement('div');el.id='intro';
  el.innerHTML=`<div class="spot l"></div><div class="spot r"></div><div class="spot c"></div><div class="floor"></div><div class="ttl" id="itl"><div class="eyebrow">THE CHRISTMAS SPECIAL</div><div class="logo"><span>SECRET</span><span>SANTA</span></div><div class="logo-year"><i></i>2026<i></i></div></div><div class="skip">タップでスキップ</div>`;
  document.body.appendChild(el);
  setTimeout(()=>el.classList.add('lit'),450);
  setTimeout(()=>{$('#itl',el).classList.add('show');},1300);
  setTimeout(()=>CF.burst(150,{y:innerHeight*.42}),1900);
  const end=()=>{el.classList.add('out');setTimeout(()=>el.remove(),750);};
  const t=setTimeout(end,4200);el.onclick=()=>{clearTimeout(t);end();};
}
render();
const h0=(location.hash||'').slice(1);
if(!h0||h0==='top')intro();

window.__ss26={derange,validMap,scores,ranking,winners,state:()=>S,readCode,makeCode};
})();
</script>
